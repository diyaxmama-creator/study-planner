<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF6F0">
<title>งานของเรา</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="งานของเรา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Pixelify+Sans:wght@400;600&family=Sarabun:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="boot" class="boot"><img src="img/cat.webp" alt=""><p class="muted">กำลังโหลด…</p></div>
<section id="login" hidden>
  <div class="login-card">
    <img class="login-cat" src="img/cat.webp" alt="">
    <h1>งานของเรา ♡</h1>
    <p>รวมงาน ตารางเรียน และโน้ตไว้ที่เดียว</p>
    <button id="login-btn" class="btn primary" type="button">เข้าสู่ระบบด้วย Google</button>
    <p id="login-msg" class="muted"></p>
  </div>
</section>

<div id="app" hidden>
  <div class="topbar">
    <div class="when">
      <span class="hero-date"></span>
      <small id="sync-info" class="muted"></small>
    </div>
    <div class="hero-tools">
      <button id="refresh-btn" class="chip" type="button">ดึงงาน</button>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="ตั้งค่า"></button>
    </div>
  </div>
  <header class="hero" id="hero">
    <div class="hello">
      <b class="hero-text"></b>
      <span class="pill" id="overdue-pill" hidden></span>
    </div>
    <div class="pic" aria-hidden="true"></div>
    <img class="deco-cat" src="img/cat.webp" alt="" aria-hidden="true">
  </header>
  <div id="banner" class="banner" hidden></div>

  <main>
    <section id="view-tasks"></section>
    <section id="view-schedule" hidden></section>
    <section id="view-notes" hidden></section>
    <section id="view-settings" hidden></section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="เพิ่ม">＋</button>
  <nav class="nav">
    <button data-view="tasks" class="on" type="button">งาน</button>
    <button data-view="schedule" type="button">ตาราง</button>
    <button data-view="notes" type="button">โน้ต</button>
  </nav>
</div>

<dialog id="sheet"></dialog>
<div id="toast" class="toast" role="status" popover="manual" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
