<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6F3">
<title>งานของเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Pixelify+Sans:wght@400;600&family=Sarabun:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<section id="login" hidden>
  <div class="login-card">
    <h1>งานของเรา ♡</h1>
    <p>รวมงาน ตารางเรียน และโน้ตไว้ที่เดียว</p>
    <button id="login-btn" class="btn primary" type="button">เข้าสู่ระบบด้วย Google</button>
    <p id="login-msg" class="muted"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="hero" id="hero">
    <div class="hello">
      <small class="hero-date"></small>
      <b class="hero-text"></b>
      <span class="pill" id="overdue-pill" hidden></span>
      <div class="hero-tools">
        <button id="refresh-btn" class="chip" type="button">รีเฟรช</button>
        <button id="settings-btn" class="icon-btn" type="button" aria-label="ตั้งค่า">⚙</button>
      </div>
      <small id="sync-info" class="muted"></small>
    </div>
    <div class="pic" aria-hidden="true"></div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main>
    <section id="view-tasks"></section>
    <section id="view-schedule" hidden></section>
    <section id="view-notes" hidden></section>
    <section id="view-settings" hidden></section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="เพิ่ม">＋</button>
  <nav class="nav">
    <button data-view="tasks" class="on" type="button">งาน</button>
    <button data-view="schedule" type="button">ตาราง</button>
    <button data-view="notes" type="button">โน้ต</button>
  </nav>
</div>

<dialog id="sheet"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
